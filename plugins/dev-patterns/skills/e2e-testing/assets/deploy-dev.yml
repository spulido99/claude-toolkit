# Pin each action by its full commit SHA before use; the guard test in e2e-testing references/10-guard-tests.md, section 1.2 fails on tags.
# .github/workflows/deploy-dev.yml
name: Deploy dev

on:
  push:
    branches: ['agent-development-*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Guard - only refs the trust policy accepts
        run: |
          case "$GITHUB_REF_NAME" in
            agent-development-*) ;;
            *) echo "::error::Ref $GITHUB_REF_NAME is not accepted by the CI role trust policy"; exit 1 ;;
          esac
          echo "ENV_SUFFIX=dev-${GITHUB_REF_NAME#agent-development-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<account-id>:role/acme-ci-deploy
          role-session-name: deploy-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stub dist folders for frontend assets
        run: mkdir -p apps/web/dist apps/console/dist

      - name: Deploy backend
        run: |
          npx cdk deploy "Acme-Backend-${ENV_SUFFIX}" \
            --require-approval never \
            --outputs-file cdk-outputs-backend.json
        working-directory: infra

      - name: Build web with backend outputs baked in
        run: |
          export EXPO_PUBLIC_API_URL="$(jq -r '.[] | .ApiUrl // empty' infra/cdk-outputs-backend.json)"
          export EXPO_PUBLIC_USER_POOL_ID="$(jq -r '.[] | .UserPoolId // empty' infra/cdk-outputs-backend.json)"
          export EXPO_PUBLIC_USER_POOL_CLIENT_ID="$(jq -r '.[] | .UserPoolClientId // empty' infra/cdk-outputs-backend.json)"
          {
            echo "API_URL=$EXPO_PUBLIC_API_URL"
            echo "USER_POOL_ID=$EXPO_PUBLIC_USER_POOL_ID"
            echo "USER_POOL_CLIENT_ID=$EXPO_PUBLIC_USER_POOL_CLIENT_ID"
          } >> "$GITHUB_ENV"
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::ApiUrl missing from backend outputs"; exit 1; }
          npm run build -w apps/web
          npm run build -w apps/console

      - name: Deploy frontend
        run: |
          npx cdk deploy "Acme-Frontend-${ENV_SUFFIX}" \
            --require-approval never \
            --outputs-file cdk-outputs-frontend.json
        working-directory: infra

      - name: Derive SMOKE_URL from the stack outputs
        id: target
        run: |
          url="$(jq -r '.[] | .AppUrl // empty' infra/cdk-outputs-frontend.json | head -n1)"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::AppUrl missing from the frontend stack outputs"; exit 1
          fi
          echo "SMOKE_URL=$url" >> "$GITHUB_ENV"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          jq -n --arg url "$url" --arg sha "$GITHUB_SHA" --arg suffix "$ENV_SUFFIX" \
            '{url: $url, sha: $sha, suffix: $suffix, deployed: true}' > deployed-env.json

      - name: Switch to the test role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<account-id>:role/acme-e2e-ci
          role-session-name: smoke-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the test role can read the operator secret
        env:
          QA_OPERATOR_SECRET_ID: acme/${{ env.ENV_SUFFIX }}/e2e/operator
        run: aws secretsmanager get-secret-value --secret-id "$QA_OPERATOR_SECRET_ID" > /dev/null

      - name: Smoke
        id: smoke
        env:
          QA_FREE_SECRET_ID: acme/${{ env.ENV_SUFFIX }}/e2e/free
          QA_PREMIUM_SECRET_ID: acme/${{ env.ENV_SUFFIX }}/e2e/premium
          QA_OPERATOR_SECRET_ID: acme/${{ env.ENV_SUFFIX }}/e2e/operator
        run: npx playwright test --config e2e/playwright.smoke.config.ts

      - name: Upload smoke report and photos
        if: always() && steps.smoke.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ env.ENV_SUFFIX }}-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload deployed environment
        if: always() && steps.target.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: deployed-env-${{ env.ENV_SUFFIX }}-${{ github.run_id }}
          path: deployed-env.json
          retention-days: 90

      # scripts/ci/expected-photo-folders.sh: e2e-testing references/11-skipped-scripts-and-photos.md, section 1.3
      - name: Photo completeness guard
        if: steps.smoke.conclusion == 'success'
        run: |
          expected="$(bash scripts/ci/expected-photo-folders.sh e2e)"
          if [ -z "$expected" ]; then
            echo "::error::The derived list of photo folders is empty; the guard would pass with nothing checked"
            exit 1
          fi
          for flow in $expected; do
            [ -d "e2e/artifacts/$flow" ] || missing="$missing $flow"
          done
          [ -z "${missing:-}" ] || { echo "::error::The smoke passed but the artifact lacks the photos of:$missing. A script skipped itself."; exit 1; }

      - name: Agent evals (after the smoke)
        run: npm run evals -w services/agent

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Dev deploy and smoke"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: ${SMOKE_URL:-not resolved}"
            echo "- This run deployed: yes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        run: |
          curl -fsS -H "Title: dev deploy red" \
            -d "$ENV_SUFFIX is not running $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.sh/${{ vars.NTFY_TOPIC }}"
